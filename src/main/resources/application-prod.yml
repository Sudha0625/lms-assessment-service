# PROD profile: docker network hostnames, secrets from env, quiet logs
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/assessmentdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
services:
  enrollment-url: http://enrollment-service:8104
  user-url: http://user-service:8101
logging:
  level:
    com.learninghub: INFO
